# Baut die iPhone-App in der Cloud von GitHub (auf einem Mac von GitHub – du brauchst keinen eigenen Mac).
# - Bei jedem Push: ein Build für den iPhone-Simulator (ohne Signatur) – prüft, dass alles übersetzt.
# - Sobald die Apple-Secrets hinterlegt sind (siehe ANLEITUNG-IOS.md): signierter Build und Upload zu TestFlight.
#   Ohne diese Secrets wird nichts signiert und nichts zu Apple geschickt.
name: iPhone-App

on:
  push:
    branches: [main]
    paths: ['ios-src/**', 'web/**', 'tools/**', 'tests/**', 'package.json', 'capacitor.config.json', 'CHANGELOG.md', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write     # nur für das Ablegen des Build-Ergebnisses im Zweig «ci-status»
    env:
      HAS_APPLE: ${{ secrets.ASC_KEY_P8_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Schutz – keine persönlichen Daten und keine Schlüssel im Projekt
        run: |
          bad=$(git ls-files | grep -Ei '(Finanzen_Daten|\.xlsx$|\.xls$|backup.*\.json$|\.jks$|\.keystore$|\.p12$|\.p8$|\.mobileprovision$|walletToken)' || true)
          if [ -n "$bad" ]; then echo "::error::Diese Dateien gehören nicht ins Projekt: $bad"; exit 1; fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Abhängigkeiten (feste Versionen) + Sicherheitsprüfung
        run: |
          npm install --no-fund --no-audit
          npm audit --omit=dev --audit-level=high
          pip install --quiet pillow==12.3.0

      - name: Web-Teil für das iPhone
        run: |
          V=$(grep -m1 -E '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | awk '{print $2}')
          echo "V=$V" >> "$GITHUB_ENV"
          python3 tools/build_www.py web "$V" ios "$GITHUB_REPOSITORY" "$GITHUB_RUN_NUMBER"
          node --check www/app.js

      - name: iPhone-Projekt vorbereiten (Capacitor-Vorlage + eigene Teile aus ios-src/)
        run: |
          python3 tools/ios_prepare.py
          npx cap sync ios
          python3 tools/harden_after_sync.py

      - name: Bauen für den Simulator (ohne Signatur) – prüft, dass alles übersetzt
        run: |
          mkdir -p dist
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            MARKETING_VERSION="$V" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ../../dist/ios-build.log | grep -E '(error|warning): |BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'BUILD SUCCEEDED' ../../dist/ios-build.log

      # ---- Ab hier nur mit Apple-Entwicklerkonto (Secrets siehe ANLEITUNG-IOS.md) ----
      # Signiert wird automatisch über den App-Store-Connect-Schlüssel (Apple verwaltet Zertifikat und Profil).
      - name: Signiert bauen und zu TestFlight hochladen
        if: env.HAS_APPLE == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8" | base64 --decode > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION="$V" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            "${AUTH[@]}" archive 2>&1 | tee -a ../../dist/ios-build.log | grep -E 'error: |ARCHIVE (SUCCEEDED|FAILED)' || true
          grep -q 'ARCHIVE SUCCEEDED' ../../dist/ios-build.log
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>upload</string>
            <key>uploadSymbols</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" 2>&1 | tee -a ../../dist/ios-build.log | tail -5

      - name: Ergebnis im Zweig «ci-status» ablegen (nur Build-Protokolle, keine Daten)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: bash tools/ci_report.sh ios
