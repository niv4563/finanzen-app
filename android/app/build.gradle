apply plugin: 'com.android.application'

android {
    namespace = "ch.nivaram.finanzen"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ch.nivaram.finanzen"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Version kommt aus dem Build (GitHub Actions): -PappVersionCode=… -PappVersionName=…
        versionCode((project.findProperty('appVersionCode') ?: '1') as Integer)
        versionName((project.findProperty('appVersionName') ?: '1.0.0') as String)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Fingerabdruck des offiziellen Signatur-Zertifikats (öffentlich, steht in jedem Release) – die App prüft sich damit selbst.
        // Bei einem neuen Signatur-Schlüssel hier anpassen (oder im Build EXPECTED_CERT setzen).
        buildConfigField "String", "EXPECTED_CERT", "\"${(System.getenv('EXPECTED_CERT') ?: '42c76c7e5e5e22ff762e35d73ac9160e327516d338fd616c72897e2d244be650').replaceAll('[^0-9A-Fa-f]', '')}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Signatur-Schlüssel nur aus Umgebungsvariablen (GitHub Secrets) – nie im Projekt gespeichert
    signingConfigs {
        release {
            def ks = System.getenv('ANDROID_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
    lint {
        abortOnError false   // schwere Fehler stoppen den Build trotzdem (lintVital); der volle Bericht läuft in GitHub Actions
        checkReleaseBuilds true
        warningsAsErrors false
    }
    dependenciesInfo {
        includeInApk = false      // keine verschlüsselten Abhängigkeits-Infos von Google im APK
        includeInBundle = true    // Play Store wünscht sie im Bundle
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
